<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kalkulator – Smart</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="shortcut icon" href="image.png" type="image/x-icon">
</head>
<body>
  <!-- BACKGROUND FX -->
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <!-- OPENING SCREEN -->
  <div id="opening">
    <div class="logo-ring">
      <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="60" cy="60" r="54" stroke="url(#ring1)" stroke-width="2" stroke-dasharray="8 6"/>
        <circle cx="60" cy="60" r="44" stroke="url(#ring2)" stroke-width="1" stroke-dasharray="3 9" opacity=".5"/>
        <defs>
          <linearGradient id="ring1" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
            <stop stop-color="#00d4ff"/><stop offset="1" stop-color="#1565c0"/>
          </linearGradient>
          <linearGradient id="ring2" x1="0" y1="120" x2="120" y2="0" gradientUnits="userSpaceOnUse">
            <stop stop-color="#42a5f5"/><stop offset="1" stop-color="#00f0ff"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="inner-icon">🖩</div>
    </div>
    <div class="opening-title">KALKULATOR</div>
    <div class="opening-sub">Futuristik - JQuery</div>
    <div class="loader-bar-wrap">
      <div class="loader-bar" id="loader"></div>
    </div>
    <div class="loader-pct" id="pct">0%</div>
  </div>

  <!-- CALCULATOR APP -->
  <div id="app">
    <div class="calc-wrapper">
      <div class="calc-header">
        <h1>CALCULATOR</h1>
        <div class="subtitle">Kalkulator Smart · jQuery</div>
      </div>
      <div class="calc-card">
        <!-- Display -->
        <div class="display">
          <div class="display-expr" id="expr"></div>
          <div class="display-main" id="display">0</div>
        </div>
        <!-- Buttons -->
        <div class="buttons">
          <!-- Row 1 -->
          <button class="btn btn-clear" data-action="clear">AC</button>
          <button class="btn btn-clear" data-action="sign">+/−</button>
          <button class="btn btn-clear" data-action="percent">%</button>
          <button class="btn btn-op"   data-action="op" data-op="/">÷</button>
          <!-- Row 2 -->
          <button class="btn btn-num" data-action="num" data-val="7">7</button>
          <button class="btn btn-num" data-action="num" data-val="8">8</button>
          <button class="btn btn-num" data-action="num" data-val="9">9</button>
          <button class="btn btn-op"  data-action="op" data-op="*">×</button>
          <!-- Row 3 -->
          <button class="btn btn-num" data-action="num" data-val="4">4</button>
          <button class="btn btn-num" data-action="num" data-val="5">5</button>
          <button class="btn btn-num" data-action="num" data-val="6">6</button>
          <button class="btn btn-op"  data-action="op" data-op="-">−</button>
          <!-- Row 4 -->
          <button class="btn btn-num" data-action="num" data-val="1">1</button>
          <button class="btn btn-num" data-action="num" data-val="2">2</button>
          <button class="btn btn-num" data-action="num" data-val="3">3</button>
          <button class="btn btn-op"  data-action="op" data-op="+">+</button>
          <!-- Row 5 -->
          <button class="btn btn-num span2" data-action="num" data-val="0">0</button>
          <button class="btn btn-num" data-action="decimal">.</button>
          <button class="btn btn-eq"  data-action="equals">=</button>
        </div>
      </div>
      <!-- History toggle -->
      <div class="history-toggle" id="histToggle">
        <span>▾</span> RIWAYAT PERHITUNGAN
      </div>
      <div class="history-panel" id="histPanel">
        <div class="history-list" id="histList">
          <div class="no-hist">Belum ada perhitungan.</div>
        </div>
      </div>
      <div class="kbd-hint">⌨ Dukung input keyboard</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
